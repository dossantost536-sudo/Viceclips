<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · VICE CLIPS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1b1b">
<!-- O GitHub Pages mostra esta página em QUALQUER endereço que não existe, inclusive em subpastas.
     Por isso tudo aqui é embutido (sem arquivos externos) e o link de volta é calculado pelo endereço. -->
<style>
  :root { color-scheme: dark; --accent: #F06AA8; --on-accent: #19171B; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
    font-family: Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff; background: #1b1b1b; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(60vw 50vh at 12% 8%, rgba(240, 106, 168, .14), transparent 70%),
                radial-gradient(50vw 50vh at 92% 96%, rgba(70, 120, 255, .10), transparent 70%); }
  .simbolo { width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 18px; display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent); box-shadow: 0 16px 40px -14px var(--accent); }
  .simbolo svg { width: 32px; height: 32px; }
  h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.03em; line-height: 1.1; }
  p { margin: 14px auto 0; max-width: 30em; color: #b9b9b9; font-size: 17px; line-height: 1.55; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; margin-top: 28px; min-height: 48px; padding: 0 24px;
    border-radius: 9999px; font-weight: 600; text-decoration: none; color: var(--on-accent); background: var(--accent);
    border: 1px solid #f7b3d2; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 10px 26px -12px var(--accent); }
  a.btn:hover { background: #f388b9; }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="simbolo" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13l10.5-6.5z"/></svg></div>
  <h1>Essa página não existe</h1>
  <p>O endereço pode ter mudado ou ter sido digitado errado. A página do VICE CLIPS continua no ar.</p>
  <a class="btn" id="voltar" href="/">Ir para a página do VICE CLIPS</a>
</main>
<script>
  // site de projeto (usuario.github.io/repositorio/): o início fica em /repositorio/; domínio próprio: em /
  (function () {
    var partes = location.pathname.split('/').filter(Boolean);
    if (/\.github\.io$/i.test(location.hostname) && partes.length) {
      document.getElementById('voltar').href = '/' + partes[0] + '/';
    }
  })();
</script>
</body>
</html>
